---
- name: Create etcd group
  ansible.builtin.group:
    name: etcd
    system: true

- name: Create etcd user
  ansible.builtin.user:
    name: etcd
    group: etcd
    system: true
    shell: /usr/sbin/nologin
    home: "{{ etcd_data_dir }}"
    create_home: false

- name: Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Create etcd configuration directory
  ansible.builtin.file:
    path: /etc/etcd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download etcd archive
  ansible.builtin.get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-arm64.tar.gz"
    dest: "/tmp/etcd-v{{ etcd_version }}-linux-arm64.tar.gz"
    mode: "0644"

- name: Extract etcd archive
  ansible.builtin.unarchive:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-arm64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/etcd-v{{ etcd_version }}-linux-arm64"

- name: Install etcd binary
  ansible.builtin.copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-arm64/etcd"
    dest: /usr/local/bin/etcd
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Install etcdctl binary
  ansible.builtin.copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-arm64/etcdctl"
    dest: /usr/local/bin/etcdctl
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Deploy etcd systemd service
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart etcd

- name: Enable and start etcd
  ansible.builtin.systemd:
    name: etcd
    enabled: true
    state: started
    daemon_reload: true